name: Chrome Domain Runner

on:
  workflow_dispatch:
  schedule:
    - cron: "7 * * * *"
    - cron: "14 * * * *"
    - cron: "20 * * * *"

concurrency:
  group: chrome-domain-runner
  cancel-in-progress: false

permissions:
  contents: read

env:
  PLAYWRIGHT_VERSION: "1.49.1"

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-playwright-${{ env.PLAYWRIGHT_VERSION }}
          restore-keys: |
            ${{ runner.os }}-npm-playwright-

      - name: Install Playwright
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund --prefer-offline \
            playwright-core@${PLAYWRIGHT_VERSION}

      - name: Verify Google Chrome
        run: |
          set -euo pipefail
          command -v google-chrome >/dev/null
          google-chrome --version

      - name: Run Chrome
        env:
          DOMAIN_NAME: ${{ secrets.DOMAIN_NAME }}
        run: node run.js
